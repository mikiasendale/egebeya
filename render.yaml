version: "1"

services:
  - type: web
    name: egebeya-app
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Paste your Turso Database URL here
      - key: DATABASE_AUTH_TOKEN
        sync: false # Paste your Turso Auth Token here
      - key: JWT_SECRET
        generateValue: true # Render auto-generates a secure secret
      - key: REFRESH_SECRET
        generateValue: true
      - key: CHAPA_SECRET_KEY
        sync: false # Paste your Chapa Secret Key here
      - key: CHAPA_WEBHOOK_SECRET
        sync: false # Paste your Chapa Webhook Signature Secret here
      - key: GEMINI_API_KEY
        sync: false # Paste your Gemini API Key here
      - key: APP_URL
        value: https://egebeya-app.onrender.com # Change to your actual Render URL once it is live
      - key: VITE_APP_URL
        value: https://egebeya-app.onrender.com # Change to your actual Render URL once it is live
