name: Test & Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (lint)
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          # Test secrets are injected from GitHub Secrets. Do NOT commit
          # literal secret values to this file — see server/tests/_setup.ts
          # which falls back to runtime-generated random secrets when the
          # operator has not configured any.
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET_TEST }}
          CHAPA_WEBHOOK_SECRET: ${{ secrets.CHAPA_WEBHOOK_SECRET_TEST }}