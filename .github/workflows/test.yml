name: Test & Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (lint)
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          REFRESH_SECRET: test-refresh-secret-yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
          CHAPA_WEBHOOK_SECRET: CyNDCzoXF7JsaPig6GErkdT0