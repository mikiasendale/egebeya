<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Business</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="hero">
      <h1>Welcome to My Business</h1>
      <p>Book your next appointment online — fast and simple</p>
      <a class="cta" href="#services">See services</a>
    </header>

    <section class="services" id="services">
      <h2>Our Services</h2>
      <ul>
        <li class="service">
          <div>
            <h3>Haircut</h3>
            <span class="duration">30 min</span>
          </div>
          <span class="price">200 ETB</span>
        </li>
        <li class="service">
          <div>
            <h3>Shave</h3>
            <span class="duration">20 min</span>
          </div>
          <span class="price">150 ETB</span>
        </li>
        <li class="service">
          <div>
            <h3>Beard Trim</h3>
            <span class="duration">15 min</span>
          </div>
          <span class="price">100 ETB</span>
        </li>
      </ul>
    </section>

    <footer>
      <p>&copy; <span id="year">My Business</span></p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
